<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Signature</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; font-family: system-ui, sans-serif;
         background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #111); }
  header { padding: 10px 14px 4px; font-size: 15px; }
  #wrap { flex: 1; margin: 6px 10px; position: relative; min-height: 0; }
  canvas { width: 100%; height: 100%; background: #fff; border: 1.5px dashed #8a8a8a; border-radius: 10px;
           touch-action: none; display: block; }
  #line { position: absolute; left: 6%; right: 6%; bottom: 28%; border-bottom: 1px solid #c9c9c9; pointer-events: none; }
  #x { position: absolute; left: 6%; bottom: 29%; color: #b5b5b5; font-size: 20px; pointer-events: none; }
  .bar { display: flex; gap: 10px; padding: 8px 10px 14px; }
  button { flex: 1; font-size: 16px; padding: 13px; border-radius: 10px; border: 0;
           background: var(--tg-theme-secondary-bg-color, #e9e9ee); color: var(--tg-theme-text-color, #111); }
  button.primary { background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); }
  #msg { min-height: 18px; padding: 0 14px; font-size: 13px; color: #c0392b; }
</style>
</head>
<body>
<header>Sign with your finger, then tap Done.</header>
<div id="wrap"><canvas id="pad"></canvas><div id="line"></div><div id="x">×</div></div>
<div id="msg"></div>
<div class="bar"><button id="clear" type="button">Clear</button><button id="done" class="primary" type="button">Done</button></div>
<script src="padcore.js"></script>
<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {} }
  var canvas = document.getElementById("pad"), ctx = canvas.getContext("2d");
  var msg = document.getElementById("msg");
  var strokes = [], current = null, cssW = 0, cssH = 0;

  function fit() {
    var r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    cssW = r.width; cssH = r.height;
    canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = 3; ctx.strokeStyle = "#12122a";
    redraw();
  }
  function redraw() {
    ctx.clearRect(0, 0, cssW, cssH);
    strokes.forEach(function (st) {
      ctx.beginPath();
      st.forEach(function (p, i) { if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]); });
      if (st.length === 1) ctx.lineTo(st[0][0] + 0.1, st[0][1]);
      ctx.stroke();
    });
  }
  function pos(e) { var r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }

  canvas.addEventListener("pointerdown", function (e) {
    canvas.setPointerCapture(e.pointerId);
    current = [pos(e)]; strokes.push(current); msg.textContent = ""; redraw(); e.preventDefault();
  });
  canvas.addEventListener("pointermove", function (e) {
    if (!current) return;
    var p = pos(e), last = current[current.length - 1];
    if (Math.hypot(p[0] - last[0], p[1] - last[1]) < 1.5) return;
    current.push(p);
    ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke();
    e.preventDefault();
  });
  function end() { current = null; }
  canvas.addEventListener("pointerup", end);
  canvas.addEventListener("pointercancel", end);

  document.getElementById("clear").addEventListener("click", function () { strokes = []; msg.textContent = ""; redraw(); });
  document.getElementById("done").addEventListener("click", function () {
    var points = strokes.reduce(function (n, s) { return n + s.length; }, 0);
    if (points < 6) { msg.textContent = "Please draw your signature first."; return; }
    var data = PadCore.encode(strokes, cssW, cssH, 3900);
    if (!data) { msg.textContent = "That drawing is too detailed. Please clear it and sign again."; return; }
    if (tg && tg.sendData) tg.sendData(data);   // closes the Mini App and hands the data to the bot
    else console.log(data);
  });
  window.addEventListener("resize", fit);
  fit();
})();
</script>
</body>
</html>
